---
name: rusqlite pin

# Weekly and on demand, so the day it goes red blocks neither pushes nor the release workflow.
"on":
  schedule:
    - cron: "11 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rusqlite-pin:
    name: A released rusqlite still cannot take sqlite-wasm-rs 0.6
    runs-on: ubuntu-latest
    steps:
      # Goes red once interop/web can drop its rusqlite git pin, which Dependabot cannot move.
      - run: |
          set -euo pipefail
          latest=$(curl -sfL -A "sqlcipher-wasm-src CI" https://crates.io/api/v1/crates/rusqlite | jq -r .crate.max_stable_version)
          cargo new --lib --quiet "$RUNNER_TEMP/probe"
          printf 'rusqlite = "=%s"\nsqlite-wasm-rs = "0.6"\n' "$latest" >> "$RUNNER_TEMP/probe/Cargo.toml"
          if cargo generate-lockfile --manifest-path "$RUNNER_TEMP/probe/Cargo.toml" 2>/dev/null; then
            echo "::error::rusqlite $latest accepts sqlite-wasm-rs 0.6, so interop/web can use it instead of the git pin"
            exit 1
          fi
          echo "rusqlite $latest still takes an older sqlite-wasm-rs, so the git pin stays"
