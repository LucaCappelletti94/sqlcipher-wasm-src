[package]
name = "sqlcipher-wasm-src"
# SQLCipher X.Y.Z is (100X+Y).Z.n, where n counts our own republishes of that release.
version = "419.0.1+sqlcipher-4.19.0-sqlite-3.53.4-libtomcrypt-1.18.2"
edition = "2021"
rust-version = "1.81"
description = "SQLCipher with a libtomcrypt provider as C source, patched for wasm32 builds via sqlite-wasm-rs"
license = "MIT AND BSD-3-Clause AND blessing AND WTFPL"
keywords = ["sqlite", "sqlcipher", "encryption", "wasm"]
categories = ["database", "development-tools::build-utils"]
readme = "README.md"
repository = "https://github.com/LucaCappelletti94/sqlcipher-wasm-src"
include = ["/src", "/sqlcipher", "/tests", "/README.md", "/LICENSE"]

[lints.rust]
missing_docs = "forbid"
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
