[package]
name = "interop-web"
version = "0.0.0"
edition = "2021"
publish = false
description = "Runs SQLCipher built from this crate inside sqlite-wasm-rs under Node.js"

[dependencies]
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"

[dev-dependencies]
sqlcipher-wasm-src = { path = "../.." }
js-sys = "0.3"
wasm-bindgen-test = "0.3"

# Standalone, so the root crate never adopts it as a member.
[workspace]
