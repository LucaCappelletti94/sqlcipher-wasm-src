[package]
name = "interop-web"
version = "0.0.0"
edition = "2021"
publish = false
description = "Runs SQLCipher built from this crate inside sqlite-wasm-rs under Node.js"

[dependencies]
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"

[dev-dependencies]
sqlcipher-wasm-src = { path = "../.." }
js-sys = "0.3"
# Released 0.40.2 pins sqlite-wasm-rs 0.5, which has no SQLITE_WASM_RS_SOURCE_DIR.
rusqlite = { git = "https://github.com/rusqlite/rusqlite", rev = "b6476751216cb8569a3f747611f37a394a8de4e3" }
wasm-bindgen-test = "0.3"

# Standalone, so the root crate never adopts it as a member.
[workspace]
